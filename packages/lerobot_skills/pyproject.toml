[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_skills"
version = "0.1.0"
description = "Robot skills in LeRobot's policy form: a registered config, reset, and select_action(observation) -> action"
requires-python = ">=3.11"
dependencies = ["draccus>=0.11.6,<0.12", "numpy"]

[project.optional-dependencies]
arm = ["mujoco>=3.3"]  # kinematics.py: an arm's IK from its MJCF

[tool.setuptools.packages.find]
include = ["lerobot_skills*"]
