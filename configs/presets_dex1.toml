task = "On the kitchen table: put the red apple into the round woven basket. Keep everything else on the table in place."

[[preset]]
name = "Kitchen: a coffee capsule into the rectangular basket"
scene = "/lambda/nfs/group-volume/dex1-demos/2026-10-23/homebody/kitchen_baskets"
task = "On the kitchen table: put one loose coffee capsule into the open rectangular basket. Keep everything else on the table in place."

[[preset]]
name = "Kitchen: apple and capsule into the baskets"
scene = "/lambda/nfs/group-volume/dex1-demos/2026-10-23/homebody/kitchen_baskets"
task = "On the kitchen table: put the red apple into the round woven basket, then put one loose coffee capsule into the open rectangular basket. Keep everything else on the table in place. If an object cannot be picked after two reasonable attempts, record that failure and continue. Finish after attempting both. Report actual outcomes, including failed grasps."
