# The G1 with Dex1-1 parallel grippers (assets/robot/dex1) and their own pick and place (skills/dex1).
# Pass with --settings configs/dex1.toml, or as a skill-benchmark episode's "settings".
[robot]
hands = "dex1"

# The Dex1 cuRobo planning server (tools/curobo_server.py --hand assets/robot/dex1), one per evaluation host
[curobo]
endpoint = "tcp://127.0.0.1:5561"
servers = 3
