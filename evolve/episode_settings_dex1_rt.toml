# Frozen settings for every evaluation episode (train, held-out and the final test), from the
# 2026-10-21 suite on: episode_settings_dex1.toml with physics in real time while the model thinks.
[agent]
reasoning_effort = "medium"
max_steps = 60
# Physics runs in real time while the model thinks (2026-10-21, feature analysis): a pause hides slip and holding
# costs during inference and differs from the HomeBody baseline branch, which always runs in real time.
pause_while_thinking = false

[coder]
# Auto mode: every failed skill call goes to the coder without the agent asking; at a stuck point (a skill
# failing until a call of it succeeds) one coder call and at most 3 more tries by the agent; 3 coder calls a task.
auto = true
tries = 3
rescues = 1
calls = 3

[plan]
enabled = true  # the agent writes a behavior-tree plan and works through it goal by goal (session/planned.py)
replans = 2

[recording]
keyframes = true  # per-stage head and wrist keyframes for the coder (session/trace.py)

# The G1 with Dex1-1 grippers (configs/dex1.toml): its hands and its planning servers
[robot]
hands = "dex1"

[curobo]
endpoint = "tcp://127.0.0.1:5561"
servers = 3
