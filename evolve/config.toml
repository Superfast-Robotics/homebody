# The harness-evolution loop's fixed configuration. Frozen: a proposal that edits evolve/** is rejected.

[remote]
host = "loki-behavior-gh"
root = "/lambda/nfs/group-volume/workcell-sim/homebody-baseline"
base = "homebody-astra"   # the seed checkout: its .venv runs every candidate, its assets hold the suite
work = "astra-evolve"     # candidates and their results
parallel = 22             # sessions per split (train and val run at once); the coder pauses the physics while it thinks

[local]
work = "/home/lohith/startup/homebody_claude/astra-evolve"

[suite]
# Each task runs one HomeBody session (episode_settings.toml: medium effort, at most 60
# steps; the agent may customize skills) scored from physics against its targets. Paths are in the
# base checkout.
train = ["assets/generated/train_*"]
# Held out: results gate acceptance but nothing about them is ever shown to the proposer.
# warehouse_shelf: the warehouse rack bay rebuilt from video on 2026-10-13 (copied unchanged from
# group-volume/homebody_video_recon_20261013_03cb5ef0/scene into the base's assets/real2sim/).
val = ["assets/generated/val_*", "assets/generated/heldout_*",
       "assets/real2sim/src_kitchen::configs/continuous_four.json",
       "assets/real2sim/warehouse_shelf::configs/warehouse_shelf_four.json"]

[agent]
# The model playing HomeBody's agent in every evaluation episode (a session/config.py MODELS key).
# GPT-6.1 Sol through the LiteLLM proxy: only HomeBody's own prompt reaches the model (no Codex
# context); the coding sub-agent is Sol too (settings.coder). v003 alone used Astra (astra-litellm).
model = "sol61-litellm"

# The checks a candidate must pass, by the highest tier its patch touches (tiers.toml).
[gates.0]
repeats = 4
[gates.1]
repeats = 4
[gates.2]
repeats = 4

[astra]
# The meta-proposer that diagnoses and patches the harness.
model = "gpt-6-astra"
effort = "medium"
proposals = 2             # distinct patches per round
timeout = 1800            # seconds per Codex call
ruff = "/home/lohith/startup/homebody_claude/astra-evolve/bin/ruff"  # same version as the remote
python = "/home/lohith/startup/homebody_claude/astra-evolve/testenv/bin/python"  # HomeBody's dependencies, for unit tests

[skills]
# Skill-level optimisation (skill_loop.py --profile NAME). A profile names the skill (a driver in
# skill_bench.py), its benchmark episodes (under the remote work dir; skill_episodes.py writes them),
# whether a failed call gets one coder rescue (the dynamic skill), which files a patch may change, the
# prompt set (prompts/<prompts>_brief.md, _diagnose.md, _propose.md), the Codex model that diagnoses and
# patches, and how many episodes run at once.
default = "pick-dynamic"

[skills.pick]
name = "pick"
episodes = "skillbench/pick_episodes"
coder = false
workdir = "pick"
prompts = "skill"
editable = ["src/homebody/skills/pick.py", "src/homebody/motion/*", "src/homebody/helpers/*",
            "src/homebody/toolkit/*", "tests/*"]
model = "gpt-6.1-sol"
effort = "medium"
parallel = 28

[skills.pickcarry]
# pick, the scripted carry walk and the walk back to the pick stance (episodes with "return"), the coder off
# (evaluation costs no credits); Astra diagnoses and patches. The end-to-end failures it targets: shallow
# grasps that drop on the walk, approach in bins, arm deadlines. (Rounds 1-3 ran one-way, workdir pickcarry;
# pickcarry-return was scored before held needed the walk, a4ee5c7.)
name = "pick"
episodes = "skillbench/pickcarry_episodes"
coder = false
workdir = "pickcarry-return2"
prompts = "skill"
editable = ["src/homebody/skills/pick.py", "src/homebody/motion/*", "src/homebody/helpers/*",
            "src/homebody/toolkit/*", "tests/*"]
model = "gpt-6-astra"
effort = "medium"
parallel = 28

[skills.picktree]
# the round-trip pickcarry episodes driven by the pick_and_carry behavior tree (homebody.tree): pick retries with
# a fresh click and the other hand, uncertain carries rechecked; no model; compare with pickcarry's baseline.
name = "pick"
episodes = "skillbench/picktree_episodes"
coder = false
workdir = "picktree"
prompts = "skill"
editable = ["src/homebody/skills/pick.py", "src/homebody/motion/*", "src/homebody/helpers/*",
            "src/homebody/toolkit/*", "src/homebody/tree/*", "tests/*"]
model = "gpt-6-astra"
effort = "medium"
parallel = 28

[skills.pick-dynamic]
# pick plus one coder rescue; improved through helpers, the coder's instructions and reports, and pick's
# structure, not by tuning pick's own decisions
name = "pick"
episodes = "skillbench/pick_episodes"
coder = true
workdir = "pick-dynamic"
prompts = "dynamic"
editable = ["src/homebody/toolkit/*", "src/homebody/motion/*", "src/homebody/helpers/*",
            "src/homebody/harness/coder_agents.md", "src/homebody/harness/coder.py",
            "src/homebody/harness/change_report.py", "src/homebody/harness/__init__.py",
            "src/homebody/skills/pick.py", "tests/*"]
model = "gpt-6.1-sol"
effort = "medium"
parallel = 24

[skills.pick-dynamic-bonsai]
# pick plus one coder rescue by a local model: Ternary-Bonsai-2-27B (PQ2_0) served on the A10 by
# Prism's llama.cpp, reached through the LiteLLM proxy; no API credits, few sessions at once
name = "pick"
episodes = "skillbench/pick_episodes"
coder = true
coder_model = "bonsai-27b"
coder_rates = "0,0,0"
workdir = "pick-dynamic-bonsai"
prompts = "dynamic"
editable = ["src/homebody/toolkit/*", "src/homebody/motion/*", "src/homebody/helpers/*",
            "src/homebody/harness/coder_agents.md", "src/homebody/harness/coder.py",
            "src/homebody/harness/change_report.py", "src/homebody/harness/__init__.py",
            "src/homebody/skills/pick.py", "tests/*"]
model = "gpt-6.1-sol"
effort = "medium"
parallel = 6

[skills.pick-dynamic-qwen]
# pick plus one coder rescue by Qwen3.8-27B (official FP8, FP8 KV cache, MTP speculative decoding) served by
# vLLM on the GH200, reached through the LiteLLM proxy; no API credits
name = "pick"
episodes = "skillbench/pick_episodes"
coder = true
coder_model = "qwen3.8-27b"
coder_rates = "0,0,0"
coder_seconds = 1800        # slower per step than Sol (served locally): 30 minutes per coder call
workdir = "pick-dynamic-qwen"
prompts = "dynamic"
editable = ["src/homebody/toolkit/*", "src/homebody/motion/*", "src/homebody/helpers/*",
            "src/homebody/harness/coder_agents.md", "src/homebody/harness/coder.py",
            "src/homebody/harness/change_report.py", "src/homebody/harness/__init__.py",
            "src/homebody/skills/pick.py", "tests/*"]
model = "gpt-6.1-sol"
effort = "medium"
parallel = 10               # as many coder sessions as the GH200's KV cache holds without queueing

[skills.pick-dynamic-luna]
# pick plus one coder rescue by GPT-6 Luna (about 20x cheaper than GPT-6.1 Sol in plan credits), through the
# LiteLLM proxy like the Sol coder; same 5-minute limit as Sol
name = "pick"
episodes = "skillbench/pick_episodes"
coder = true
coder_model = "gpt-6-luna"
coder_rates = "2.5,0.25,12.5"
workdir = "pick-dynamic-luna"
prompts = "dynamic"
editable = ["src/homebody/toolkit/*", "src/homebody/motion/*", "src/homebody/helpers/*",
            "src/homebody/harness/coder_agents.md", "src/homebody/harness/coder.py",
            "src/homebody/harness/change_report.py", "src/homebody/harness/__init__.py",
            "src/homebody/skills/pick.py", "tests/*"]
model = "gpt-6-astra"        # Astra diagnoses and proposes (the meta-optimizer)
effort = "medium"
proposals = 3               # per round: the diagnosis's three highest-impact mechanisms, in order
parallel = 24

[skills.pick-dynamic-qwen36]
# pick plus one coder rescue by Qwen3.6-35B-A3B (official FP8, FP8 KV cache, MTP speculative decoding) served by
# vLLM (MTP) on the GH200, reached through the LiteLLM proxy; no API credits
name = "pick"
episodes = "skillbench/pick_episodes"
coder = true
coder_model = "qwen3.6-35b-a3b"
coder_rates = "0,0,0"
coder_seconds = 900         # served locally: 15 minutes per coder call
workdir = "pick-dynamic-qwen36"
prompts = "dynamic"
editable = ["src/homebody/toolkit/*", "src/homebody/motion/*", "src/homebody/helpers/*",
            "src/homebody/harness/coder_agents.md", "src/homebody/harness/coder.py",
            "src/homebody/harness/change_report.py", "src/homebody/harness/__init__.py",
            "src/homebody/skills/pick.py", "tests/*"]
model = "gpt-6-astra"        # Astra diagnoses and proposes (the meta-optimizer)
effort = "medium"
proposals = 3               # per round: the diagnosis's three highest-impact mechanisms, in order
parallel = 24               # more concurrent coder sessions starve the GPU: at 54, nearly every call timed out

[skills.pickcoder-seed]
# phase 1 measurement: the round-trip pickcarry episodes with one coder rescue per failed pick (Sol, 5 minutes),
# astra-seed code: the coder works from text and the head image; baseline only, the two arms compared episode by episode.
name = "pick"
episodes = "skillbench/pickcarry_episodes"
coder = true
workdir = "pickcoder-seed"
prompts = "dynamic_open"
editable = ["src/homebody/skills/pick.py", "tests/*"]
model = "gpt-6-astra"
effort = "medium"
parallel = 24

[skills.pickcoder-traces]
# phase 1 measurement: the round-trip pickcarry episodes with one coder rescue per failed pick (Sol, 5 minutes),
# phase1-traces code: the coder also gets the failed call's keyframe trace; baseline only, the two arms compared episode by episode.
name = "pick"
episodes = "skillbench/pickcarry_episodes"
coder = true
workdir = "pickcoder-traces"
prompts = "dynamic_open"
editable = ["src/homebody/skills/pick.py", "tests/*"]
model = "gpt-6-astra"
effort = "medium"
parallel = 24

[skills.pick-dynamic-sol-open]
# pick plus one coder rescue by GPT-6.1 Sol (the default coder model, 5-minute calls); Astra may also change
# pick's own decisions when evidence across episodes supports a general change (prompts dynamic_open)
name = "pick"
episodes = "skillbench/pick_episodes"
coder = true
workdir = "pick-dynamic-sol-open"
prompts = "dynamic_open"
editable = ["src/homebody/toolkit/*", "src/homebody/motion/*", "src/homebody/helpers/*",
            "src/homebody/harness/coder_agents.md", "src/homebody/harness/coder.py",
            "src/homebody/harness/change_report.py", "src/homebody/harness/__init__.py",
            "src/homebody/skills/pick.py", "tests/*"]
model = "gpt-6-astra"        # Astra diagnoses and proposes (the meta-optimizer)
effort = "medium"
proposals = 3
parallel = 24

[skills.place-dynamic-sol-open]
# place plus one coder rescue by GPT-6.1 Sol (the default coder model, 5-minute calls); Astra may also change
# place's own decisions when evidence across episodes supports a general change (prompts dynamic_open)
name = "place"
episodes = "skillbench/place_episodes"
coder = true
workdir = "place-dynamic-sol-open"
prompts = "dynamic_open"
editable = ["src/homebody/toolkit/*", "src/homebody/motion/*", "src/homebody/helpers/*",
            "src/homebody/harness/coder_agents.md", "src/homebody/harness/coder.py",
            "src/homebody/harness/change_report.py", "src/homebody/harness/__init__.py",
            "src/homebody/skills/place.py", "tests/*"]
model = "gpt-6-astra"        # Astra diagnoses and proposes (the meta-optimizer)
effort = "medium"
proposals = 3
parallel = 24

[skills.navigate-dynamic-sol-open]
# navigate (carrying) plus one coder rescue by GPT-6.1 Sol (5-minute calls) on the move_variety rooms; Astra
# may also change navigate's own decisions when evidence across episodes supports a general change
name = "navigate"
episodes = "skillbench/move_episodes"
coder = true
workdir = "navigate-dynamic-sol-open"
prompts = "dynamic_open"
editable = ["src/homebody/toolkit/*", "src/homebody/motion/*", "src/homebody/helpers/*",
            "src/homebody/harness/coder_agents.md", "src/homebody/harness/coder.py",
            "src/homebody/harness/change_report.py", "src/homebody/harness/__init__.py",
            "src/homebody/skills/navigate.py", "tests/*"]
model = "gpt-6-astra"        # Astra diagnoses and proposes (the meta-optimizer)
effort = "medium"
proposals = 3
parallel = 24

[skills.newskill-sol]
# creating new skills: the coding assistant (GPT-6.1 Sol, 10-minute calls) gets a request for a skill that does
# not exist and must write and run it; Astra improves building blocks, the new-skill template, the assistant's
# instructions and reports (built-in skills fixed). Validation and test ask for kinds of skill train never does.
name = "newskill"
episodes = "skillbench/newskill_episodes"
coder = true
coder_seconds = 600
workdir = "newskill-sol"
prompts = "newskill"
editable = ["src/homebody/toolkit/*", "src/homebody/motion/*", "src/homebody/helpers/*",
            "src/homebody/harness/coder_agents.md", "src/homebody/harness/coder.py",
            "src/homebody/harness/change_report.py", "src/homebody/harness/__init__.py",
            "src/homebody/session/coder.py", "tests/*"]
model = "gpt-6-astra"        # Astra diagnoses and proposes (the meta-optimizer)
effort = "medium"
proposals = 3
parallel = 24
