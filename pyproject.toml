[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homebody"
version = "0.1.0"
description = "An open-source agentic framework for vision-language models to control humanoid robots on long-horizon tasks"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26", "scipy>=1.13", "mujoco==3.11.0", "torch>=2.4",
  "pillow>=10", "trimesh>=4.4", "viser>=1.1", "imageio-ffmpeg>=0.6", "websockets>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4"]
# Linux G1 + LiDAR + iPhone. Build CycloneDDS C 0.10.2 first; see the exploration guide.
exploration = [
  "mcap==1.5.0",
  "opencv-python>=4.10,<5", "matplotlib>=3.8", "scikit-image>=0.24",
  "pyzmq>=27.0", "yourdfpy>=0.0.56",
  "far-unitree-sdk==0.1.5", "cyclonedds==0.10.2",
  "unitree-sdk2py @ git+https://github.com/unitreerobotics/unitree_sdk2_python.git@65691c8a8bc53b98d3976dba4dbf9d5d20b2e7f5",
]
planning = ["pyzmq>=26", "msgpack>=1.0", "msgpack-numpy>=0.4.8"]

[project.scripts]
homebody = "homebody.__main__:main"

[tool.setuptools]
package-dir = { "" = "src", "holosoma_inference" = "vendor/holosoma_inference" }

[tool.setuptools.packages.find]
where = ["src", "vendor"]

[tool.setuptools.package-data]
homebody = ["**/*.md"]
"homebody.real2sim.exploration.record" = ["*.sh", "*.yaml", "*.txt"]
holosoma_inference = ["LICENSE*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "vendor"]

[tool.ruff]
line-length = 100
